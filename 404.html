<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | Le Petit Four Artisan Bakery</title>
  <meta name="description" content="The page you are looking for is currently being baked or does not exist. Return to Le Petit Four Artisan Bakery.">
  
  <!-- Fonts & Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="css/style.css">
  <style>
    .error-page-wrapper {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
      background: radial-gradient(circle at 50% 20%, rgba(200, 131, 52, 0.1) 0%, transparent 60%),
                  radial-gradient(circle at 10% 90%, rgba(230, 165, 148, 0.12) 0%, transparent 50%),
                  var(--bg-cream);
      text-align: center;
    }

    .error-card {
      background: #FFFFFF;
      border: 1px solid var(--border-light);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      padding: 3.5rem 2.5rem;
      max-width: 680px;
      width: 100%;
      position: relative;
    }

    .error-code-badge {
      font-size: clamp(4.5rem, 12vw, 7.5rem);
      font-family: var(--font-serif);
      font-weight: 800;
      color: var(--accent-caramel);
      line-height: 1;
      margin-bottom: 0.5rem;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .error-icon {
      font-size: 0.85em;
      color: var(--accent-gold);
      animation: floatSlow 3s ease-in-out infinite;
    }

    .error-card h1 {
      font-size: clamp(1.6rem, 3.8vw, 2.2rem);
      color: var(--primary-dark);
      margin-bottom: 1rem;
    }

    .error-card p {
      font-size: 1.05rem;
      color: var(--text-muted);
      line-height: 1.65;
      margin-bottom: 2.2rem;
      max-width: 520px;
      margin-left: auto;
      margin-right: auto;
    }

    .error-actions {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      flex-wrap: wrap;
    }

    @media (max-width: 576px) {
      .error-card {
        padding: 2.25rem 1.25rem;
      }
      .error-actions {
        flex-direction: column;
        width: 100%;
      }
      .error-actions .btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <!-- ==================== 404 ERROR SECTION ==================== -->
  <div class="error-page-wrapper">
    <!-- Brand Logo -->
    <div style="margin-bottom: 1.5rem;">
      <a href="index.html" title="Return to Home">
        <img src="assets/logo.webp" alt="Le Petit Four Artisan Bakery" style="height: 48px; object-fit: contain;">
      </a>
    </div>

    <div class="error-card">
      <div class="error-code-badge">
        <span>4</span>
        <i class="fa-solid fa-cookie-bite error-icon"></i>
        <span>4</span>
      </div>

      <div class="section-tag" style="margin-bottom: 0.85rem;">
        <i class="fa-solid fa-wheat-awn"></i> Page Not Found
      </div>

      <h1>Oops! This Recipe Is Still In The Oven</h1>
      <p>
        The page or resource you are trying to access is currently being prepared or does not exist. Let's get you back to fresh breads, pastries, and your dashboard.
      </p>

      <div class="error-actions">
        <a href="index.html" class="btn btn-primary btn-lg">
          <i class="fa-solid fa-house"></i>
          <span>Return Home</span>
        </a>
        <button type="button" onclick="history.length > 1 ? history.back() : window.location.href='index.html';" class="btn btn-outline btn-lg">
          <i class="fa-solid fa-arrow-left"></i>
          <span>Go Back</span>
        </button>
      </div>
    </div>
  </div>

</body>
</html>
